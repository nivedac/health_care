<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center p-container-margin md:p-0">
<!-- Main Content Canvas -->
<main class="w-full max-w-md mx-auto">
<!-- Illustration Area -->
<div class="mb-stack-lg rounded-3xl overflow-hidden soft-shadow relative h-64 md:h-80 w-full">
<img class="w-full h-full object-cover" data-alt="A premium, modern medical illustration showing a stylized doctor interacting with a digital interface. The scene is bright and airy, utilizing a high-key light mode aesthetic with soft white backgrounds. The color palette features clinical Emerald Green (#006a3b) accents against pristine white and soft grey tones. The mood is professional, welcoming, and technologically advanced, conveying trust and efficiency in healthcare." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCkawCAw56DE8Fw7PiupwtuAtC9uNcjjfZSwpIBZ7xfz2RCUPDr9GS6AdPQYIVxRjcrnq2x9HOJchK5jMDoaqUpYQZeJYIYJZJ6miqUwNcc7Tjzt5Od62gL43YyqvW7ofv9RaVCFdIzP6GxB15nSuZchws3C_TTKWdOMH0i2Gkn5blREkS0Z6S2OkC-O091xUnsVU1Ualu-ev8c7zJJLeYTMnfUlnUlk_r5cZzsg80h1zKg8tN0QEJV39syR9LRHT4bT51asgWZZA"/>
<!-- Gradient Overlay -->
<div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent flex items-end p-container-margin">
<div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-white mb-stack-sm">Welcome Back</h1>
<p class="font-body-md text-body-md text-white/90">Book your appointment without waiting.</p>
</div>
</div>
</div>
<!-- Login Card -->
<div class="glass-panel rounded-3xl p-container-margin soft-shadow relative z-10 -mt-12 bg-surface">
<form action="#" class="space-y-stack-md" method="POST">
<!-- Phone Input Group -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-unit" for="phone">Phone Number</label>
<div class="flex items-center border border-outline-variant rounded-xl overflow-hidden bg-surface-container-lowest transition-all duration-300 input-focus-glow focus-within:border-primary">
<!-- Country Code Picker -->
<div class="flex items-center px-3 py-3 border-r border-outline-variant bg-surface-container-low text-on-surface">
<span class="font-body-md text-body-md font-medium mr-1">+1</span>
<span class="material-symbols-outlined text-sm text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">arrow_drop_down</span>
</div>
<!-- Number Input -->
<input class="flex-1 w-full border-none focus:ring-0 px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline bg-transparent" id="phone" name="phone" placeholder="(555) 123-4567" required="" type="tel"/>
</div>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start mt-stack-md">
<div class="flex items-center h-5">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary bg-surface-container-lowest cursor-pointer" id="terms" name="terms" required="" type="checkbox"/>
</div>
<div class="ml-3 text-sm">
<label class="font-body-md text-body-md text-on-surface-variant text-sm" for="terms">
                            I agree to the <a class="text-primary hover:underline font-medium" href="#">Privacy Policy</a> and <a class="text-primary hover:underline font-medium" href="#">Terms of Service</a>.
                        </label>
</div>
</div>
<!-- Primary Button -->
<div class="pt-stack-sm">
<button class="w-full flex justify-center items-center py-4 px-6 border border-transparent rounded-full shadow-sm font-title-md text-title-md text-on-primary bg-primary hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all duration-300 transform hover:scale-[1.02] active:scale-[0.98]" type="submit">
                        Continue
                        <span class="material-symbols-outlined ml-2 text-xl" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</div>
</form>
<!-- Alternative Action -->
<div class="mt-stack-lg text-center">
<a class="inline-flex items-center justify-center px-6 py-3 border border-transparent font-title-md text-title-md text-primary bg-secondary-container/30 hover:bg-secondary-container/50 rounded-full transition-all duration-300" href="#">
<span class="material-symbols-outlined mr-2 text-xl" style="font-variation-settings: 'FILL' 0;">dialpad</span>
                    Login with OTP
                </a>
</div>
</div>
</main>
<script>
        // Simple micro-interaction for the input field to simulate active formatting
        const phoneInput = document.getElementById('phone');
        phoneInput.addEventListener('input', function (e) {
            let x = e.target.value.replace(/\D/g, '').match(/(\d{0,3})(\d{0,3})(\d{0,4})/);
            e.target.value = !x[2] ? x[1] : '(' + x[1] + ') ' + x[2] + (x[3] ? '-' + x[3] : '');
        });
    </script>
