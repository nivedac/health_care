<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Live Queue - Dr. Baiju's Healthcare</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-background": "#191c1d",
                      "secondary": "#56615c",
                      "background": "#f8f9fa",
                      "on-error": "#ffffff",
                      "tertiary-fixed-dim": "#95d5a8",
                      "on-surface": "#191c1d",
                      "on-secondary-fixed": "#141e1a",
                      "on-secondary": "#ffffff",
                      "on-surface-variant": "#3f4941",
                      "on-secondary-fixed-variant": "#3f4945",
                      "on-error-container": "#93000a",
                      "primary-fixed-dim": "#7ed99e",
                      "secondary-container": "#dae5df",
                      "surface-container-low": "#f3f4f5",
                      "primary-container": "#268451",
                      "on-primary-fixed": "#00210f",
                      "outline-variant": "#becabe",
                      "inverse-on-surface": "#f0f1f2",
                      "on-secondary-container": "#5c6762",
                      "surface-container-lowest": "#ffffff",
                      "surface-bright": "#f8f9fa",
                      "on-primary-fixed-variant": "#00522d",
                      "tertiary-container": "#43815b",
                      "surface-dim": "#d9dadb",
                      "inverse-primary": "#7ed99e",
                      "surface-tint": "#006d3d",
                      "on-primary": "#ffffff",
                      "on-tertiary": "#ffffff",
                      "on-tertiary-fixed-variant": "#0e5130",
                      "outline": "#6f7a70",
                      "surface": "#f8f9fa",
                      "primary-fixed": "#9af6b8",
                      "surface-container-high": "#e7e8e9",
                      "surface-container": "#edeeef",
                      "on-tertiary-container": "#f6fff5",
                      "primary": "#006a3b",
                      "inverse-surface": "#2e3132",
                      "error": "#ba1a1a",
                      "surface-variant": "#e1e3e4",
                      "on-tertiary-fixed": "#00210f",
                      "on-primary-container": "#f6fff4",
                      "surface-container-highest": "#e1e3e4",
                      "error-container": "#ffdad6",
                      "tertiary": "#296743",
                      "secondary-fixed": "#dae5df",
                      "tertiary-fixed": "#b0f1c3",
                      "secondary-fixed-dim": "#bec9c3"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "unit": "4px",
                      "container-margin": "24px",
                      "stack-md": "16px",
                      "gutter": "16px",
                      "stack-sm": "8px",
                      "stack-lg": "32px"
              },
              "fontFamily": {
                      "headline-lg-mobile": [
                              "Inter"
                      ],
                      "label-sm": [
                              "Inter"
                      ],
                      "display-lg": [
                              "Inter"
                      ],
                      "body-md": [
                              "Inter"
                      ],
                      "title-md": [

                      ],
                      "body-lg": [

                      ],

                      ]
              },
              "fontSize": {
                      "headline-lg-mobile": [
                              "24px",

                                      "lineHeight": "32px",
                                      "fontWeight": "600"
                              }
                      ],
                      "label-sm": [
                              "12px",
                              {
                                      "lineHeight": "16px",
                                      "letterSpacing": "0.05em",

                      ],
                      "display-lg": [
                              "48px",

                      ],
                      "body-md": [

                                      "lineHeight": "20px",
                                      "fontWeight": "400"

                      ],
                      "title-md": [
                              "20px",
                              {
                                      "lineHeight": "28px",
                                      "fontWeight": "600"
                              }
                      ],
                      "body-lg": [

                                      "lineHeight": "24px",
                                      "fontWeight": "400"
                              }
                      ],
                      "headline-lg": [
                              "32px",
                              {
                                      "lineHeight": "40px",
                                      "letterSpacing": "-0.01em",
                                      "fontWeight": "600"
                              }
                      ]
              }
      },
          },
        }
    </script>
<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05);
        }
        .pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 106, 59, 0.3); }
            70% { transform: scale(1); box-shadow: 0 0 0 20px rgba(0, 106, 59, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 106, 59, 0); }
        }
        .progress-circle {
            transition: stroke-dashoffset 1s ease-out;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background antialiased min-h-screen flex flex-col font-body-md">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-xl shadow-sm">
<div class="flex items-center justify-between px-container-margin py-unit h-16 bg-transparent">
<div class="flex items-center gap-stack-md">
<button aria-label="Go back" class="text-on-surface-variant dark:text-on-surface-variant hover:opacity-80 transition-opacity scale-95 duration-300 ease-out-expo">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary dark:text-primary-fixed-dim">Dr. Baiju's Healthcare</h1>
</div>
<button aria-label="Notifications" class="text-on-surface-variant dark:text-on-surface-variant hover:opacity-80 transition-opacity scale-95 duration-300 ease-out-expo">
<span class="material-symbols-outlined text-[24px]">notifications</span>
</button>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-grow pt-[88px] pb-[96px] px-container-margin md:px-8 max-w-3xl mx-auto w-full flex flex-col gap-stack-lg">
<!-- Queue Status Header -->
<div class="text-center mt-stack-md">
<h2 class="font-title-md text-title-md text-on-surface mb-unit">Live Queue Status</h2>
<p class="font-body-md text-body-md text-secondary">General Consultation - Room 3</p>
</div>
<!-- Central Circular Progress -->
<div class="relative flex justify-center items-center py-stack-lg">
<div class="relative w-64 h-64 pulse-ring rounded-full flex items-center justify-center bg-surface-container-lowest shadow-[0_8px_40px_0_rgba(0,0,0,0.08)]">
<!-- SVG Circle for Progress -->
<svg class="absolute inset-0 w-full h-full transform -rotate-90" viewbox="0 0 100 100">
<!-- Background Track -->
<circle cx="50" cy="50" fill="none" r="45" stroke="#dae5df" stroke-linecap="round" stroke-width="6"></circle>
<!-- Progress Track (Calculated 18/24 = 75%) -->
<circle class="progress-circle text-primary" cx="50" cy="50" fill="none" r="45" stroke="#006a3b" stroke-dasharray="283" stroke-dashoffset="71" stroke-linecap="round" stroke-width="6"></circle>
</svg>
<div class="text-center z-10 flex flex-col items-center">
<span class="font-label-sm text-label-sm text-secondary uppercase tracking-wider mb-unit">Current Token</span>
<span class="font-display-lg text-display-lg text-primary mb-2">18</span>
<div class="h-px w-16 bg-surface-variant mb-2"></div>
<span class="font-label-sm text-label-sm text-secondary uppercase tracking-wider mb-unit">Your Token</span>
<span class="font-title-md text-title-md text-on-surface">24</span>
</div>
</div>
</div>
<!-- Details Bento Grid -->
<div class="grid grid-cols-2 gap-gutter">
<!-- Patients Ahead -->
<div class="glass-card rounded-[20px] p-stack-md flex flex-col items-center justify-center text-center">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center mb-stack-sm text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">group</span>
</div>
<span class="font-display-lg text-[32px] leading-[40px] font-bold text-on-surface mb-unit">6</span>
<span class="font-body-md text-body-md text-secondary">Patients Ahead</span>
</div>
<!-- Estimated Waiting -->
<div class="glass-card rounded-[20px] p-stack-md flex flex-col items-center justify-center text-center">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center mb-stack-sm text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">schedule</span>
</div>
<span class="font-display-lg text-[32px] leading-[40px] font-bold text-on-surface mb-unit">40<span class="text-[20px]">m</span></span>
<span class="font-body-md text-body-md text-secondary">Est. Waiting Time</span>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-stack-sm mt-auto pb-stack-lg">
<div class="grid grid-cols-2 gap-gutter">
<button class="bg-primary text-on-primary rounded-full py-3 px-6 font-title-md text-[16px] leading-6 font-semibold flex items-center justify-center gap-2 hover:opacity-90 transition-opacity scale-95 duration-300 ease-out-expo shadow-sm">
<span class="material-symbols-outlined text-[20px]">call</span>
                    Call Clinic
                </button>
<button class="bg-surface-container-low border border-outline-variant text-on-surface rounded-full py-3 px-6 font-title-md text-[16px] leading-6 font-semibold flex items-center justify-center gap-2 hover:bg-surface-variant transition-colors scale-95 duration-300 ease-out-expo shadow-sm">
<span class="material-symbols-outlined text-[20px]">directions</span>
                    Directions
                </button>
</div>
<button class="text-error font-body-md text-body-md py-3 text-center hover:underline transition-all mt-unit">
                Cancel Booking
            </button>
</div>
</main>
<!-- Bottom Navigation Shell suppressed because this is a focused task/transactional screen -->
<script>
        // Simple micro-interaction for buttons
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('mousedown', () => {
                btn.style.transform = 'scale(0.98)';
            });
            btn.addEventListener('mouseup', () => {
                btn.style.transform = 'scale(1)';
            });
            btn.addEventListener('mouseleave', () => {
                btn.style.transform = 'scale(1)';
            });
        });
    </script>
</body></html>
