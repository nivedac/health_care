<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F9FAFB; /* Level 0 Surface */
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.05);
        }
        .success-pulse {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(38, 132, 81, 0.3); }
            70% { transform: scale(1); box-shadow: 0 0 0 20px rgba(38, 132, 81, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(38, 132, 81, 0); }
        }
        
        /* Minimal Confetti */
        .confetti-piece {
            position: absolute;
            width: 8px;
            height: 16px;
            background: #268451;
            opacity: 0;
            top: 0;
            border-radius: 4px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center relative overflow-hidden px-container-margin md:px-0">
<!-- Confetti Container -->
<div class="absolute inset-0 pointer-events-none z-0" id="confetti-container"></div>
<!-- Main Content Canvas -->
<main class="w-full max-w-md z-10">
<!-- Glassmorphism Card -->
<div class="glass-card rounded-[20px] p-stack-lg flex flex-col items-center text-center transform transition-all duration-300 ease-out-expo hover:-translate-y-1">
<!-- Success Animation Icon -->
<div class="w-24 h-24 rounded-full bg-primary-container/10 flex items-center justify-center mb-stack-md success-pulse relative">
<span class="material-symbols-outlined text-primary text-[48px]" data-weight="fill" style="font-variation-settings: 'FILL' 1;">
                    check_circle
                </span>
</div>
<!-- Headers -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background mb-unit">Booking Confirmed!</h1>
<p class="font-body-lg text-body-lg text-secondary mb-stack-lg">Your appointment has been successfully scheduled.</p>
<!-- Key Information Grid -->
<div class="w-full bg-surface-container-low rounded-xl p-stack-md flex flex-col gap-stack-sm mb-stack-lg">
<div class="flex justify-between items-center py-unit border-b border-surface-variant">
<span class="font-body-md text-body-md text-secondary">Token Number</span>
<span class="font-title-md text-title-md text-primary font-bold">24</span>
</div>
<div class="flex justify-between items-center py-unit">
<span class="font-body-md text-body-md text-secondary">Estimated Time</span>
<span class="font-title-md text-title-md text-on-surface">6:40 PM</span>
</div>
</div>
<!-- Action Buttons -->
<div class="w-full flex flex-col gap-stack-sm">
<button class="w-full bg-primary text-on-primary rounded-full py-3 font-body-lg text-body-lg font-medium transition-all duration-300 ease-out-expo hover:scale-[1.02] active:scale-95 shadow-[0_4px_14px_0_rgba(0,106,59,0.39)] hover:shadow-[0_6px_20px_rgba(0,106,59,0.23)]">
                    View Queue
                </button>
<button class="w-full bg-surface-container-high text-primary rounded-full py-3 font-body-lg text-body-lg font-medium transition-all duration-300 ease-out-expo hover:bg-surface-variant hover:scale-[1.02] active:scale-95">
                    Go Home
                </button>
</div>
</div>
</main>
<script>
        // Minimal Confetti Logic
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('confetti-container');
            const colors = ['#006a3b', '#7ed99e', '#95d5a8', '#f0f1f2'];
            
            for (let i = 0; i < 40; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti-piece');
                
                // Randomize properties
                const color = colors[Math.floor(Math.random() * colors.length)];
                const left = Math.random() * 100 + 'vw';
                const animationDuration = Math.random() * 2 + 2 + 's';
                const animationDelay = Math.random() * 1 + 's';
                
                confetti.style.backgroundColor = color;
                confetti.style.left = left;
                
                // Simple CSS animation for falling
                confetti.animate([
                    { transform: `translate3d(0, -10vh, 0) rotate(0deg)`, opacity: 1 },
                    { transform: `translate3d(${Math.random()*100 - 50}px, 110vh, 0) rotate(${Math.random()*360}deg)`, opacity: 0 }
                ], {
                    duration: Math.random() * 2000 + 1500,
                    delay: Math.random() * 500,
                    easing: 'cubic-bezier(.37,0,.63,1)',
                    fill: 'forwards'
                });
                
                container.appendChild(confetti);
            }
        });
    </script>
