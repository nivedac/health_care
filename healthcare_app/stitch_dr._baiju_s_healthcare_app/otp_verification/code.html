<body class="bg-background text-on-background h-screen w-full flex items-center justify-center overflow-hidden">

<input class="otp-input w-12 h-14 rounded-lg text-center font-title-md text-title-md bg-surface-bright text-on-surface focus:bg-surface-container-lowest" inputmode="numeric" maxlength="1" type="text"/>
<input class="otp-input w-12 h-14 rounded-lg text-center font-title-md text-title-md bg-surface-bright text-on-surface focus:bg-surface-container-lowest" inputmode="numeric" maxlength="1" type="text"/>
<input class="otp-input w-12 h-14 rounded-lg text-center font-title-md text-title-md bg-surface-bright text-on-surface focus:bg-surface-container-lowest" inputmode="numeric" maxlength="1" type="text"/>

<button class="w-full h-12 bg-surface-container-low text-primary rounded-full font-title-md text-title-md flex items-center justify-center hover:bg-surface-container-highest active:scale-95 ease-out-expo duration-300">

                </button>

<script>
        // OTP Input Logic
        const inputs = document.querySelectorAll('.otp-input');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length > 1) {
                    e.target.value = e.target.value.slice(0, 1);
                }
                
                // Move to next input if value is entered
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                // Move to previous input on backspace
                if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                    inputs[index - 1].focus();
                }
            });
            
            // Allow paste
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pastedData = e.clipboardData.getData('text').slice(0, inputs.length).replace(/[^0-9]/g, '');
                
                for(let i = 0; i < pastedData.length; i++) {
                    if(inputs[i]) {
                        inputs[i].value = pastedData[i];
                        if(i < inputs.length - 1) inputs[i+1].focus();
                    }
                }
            });
        });

        // Timer Logic
        let timeLeft = 119; // 1 min 59 sec
        const timerDisplay = document.getElementById('timer');
        
        const countdown = setInterval(() => {
            if(timeLeft <= 0) {
                clearInterval(countdown);
                timerDisplay.textContent = "00:00";
                // Optionally enable resend button here
            } else {
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `0${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
                timeLeft--;
            }
        }, 1000);
    </script>
