<style>
        .pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0; }
            100% { transform: scale(0.95); opacity: 0; }
        }

        .fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .fade-in-up-delay-1 { animation-delay: 0.2s; }
        .fade-in-up-delay-2 { animation-delay: 0.4s; }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .heartbeat-path {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: dash 3s linear infinite;
        }

        @keyframes dash {
            to { stroke-dashoffset: 0; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background min-h-screen flex flex-col items-center justify-center relative overflow-hidden font-body-md text-body-md text-on-background">
<!-- Decorative Background Elements -->
<div class="absolute top-[-10%] left-[-10%] w-[40vw] h-[40vw] bg-primary-container rounded-full opacity-5 blur-[100px] pointer-events-none"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[50vw] h-[50vw] bg-tertiary-container rounded-full opacity-5 blur-[120px] pointer-events-none"></div>
<main class="flex-1 flex flex-col items-center justify-center z-10 w-full px-container-margin">
<!-- Logo & Animation Container -->
<div class="relative mb-stack-lg fade-in-up">
<!-- Pulsing Rings -->
<div class="absolute inset-0 bg-primary-container rounded-full pulse-ring blur-md"></div>
<div class="absolute inset-[-10px] bg-primary-fixed-dim rounded-full pulse-ring blur-lg opacity-30" style="animation-delay: 0.5s;"></div>
<!-- Central Logo Circle -->
<div class="relative w-32 h-32 md:w-40 md:h-40 bg-surface rounded-full shadow-[0_8px_30px_rgb(0,0,0,0.08)] flex items-center justify-center border-2 border-surface-container-highest z-20 overflow-hidden">
<span class="material-symbols-outlined text-primary text-[64px] md:text-[80px]" style="font-variation-settings: 'FILL' 1;">favorite</span>
<!-- SVG Heartbeat Line Overlay -->
<svg class="absolute inset-0 w-full h-full text-primary-fixed opacity-60" preserveaspectratio="none" viewbox="0 0 100 100">
<path class="heartbeat-path" d="M0 50 L30 50 L40 20 L50 80 L60 40 L70 50 L100 50" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"></path>
</svg>
</div>
</div>
<!-- Typography -->
<div class="text-center fade-in-up fade-in-up-delay-1">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-background mb-stack-sm tracking-tight">
                Dr. Baiju's Healthcare
            </h1>
<p class="font-title-md text-title-md text-secondary">
                Smart Clinic Management
            </p>
</div>
</main>
<!-- Footer Branding -->
<footer class="absolute bottom-safe pb-stack-lg w-full text-center z-10 fade-in-up fade-in-up-delay-2">
<div class="flex flex-col items-center justify-center opacity-70">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest mb-unit">Powered by</span>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-sm" style="font-variation-settings: 'FILL' 1;">medical_services</span>
<span class="font-body-md text-body-md font-medium text-on-surface">Dr. Baiju's Healthcare</span>
</div>
</div>
</footer>
